name: lyra
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  reorderable_grid_view: ^2.2.6
  image_cropper: ^12.2.1
  shared_preferences: ^2.5.6
  on_audio_query: ^2.9.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_riverpod: ^3.4.3
  file_picker: ^13.3.0
  permission_handler: ^13.0.2
  image_picker: ^1.2.4
  intl: ^0.20.2
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.15.1

assets:
  - assets/icons/

flutter:
  uses-material-design: true
  fonts:
    - family: LyraFont
      fonts:
        - asset: assets/fonts/Aclonica-Regular.ttf
          weight: 900